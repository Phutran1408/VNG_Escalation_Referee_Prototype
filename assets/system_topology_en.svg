<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%" style="background: #ffffff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="vlmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>

    <linearGradient id="rulesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <linearGradient id="autoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>

    <linearGradient id="llmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>

    <linearGradient id="mgrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>

    <linearGradient id="ledgerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrSlate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>

    <!-- Shadows -->
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Outer Canvas Container -->
  <rect x="12" y="12" width="836" height="456" rx="12" fill="url(#canvasGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Diagram Title / Header -->
  <g transform="translate(32, 38)">
    <rect x="0" y="0" width="8" height="20" rx="2" fill="#2563eb"/>
    <text x="16" y="15" font-size="14" font-weight="700" fill="#0f172a" letter-spacing="0.02em">FIGURE 1: AER RUNTIME TOPOLOGY &amp; DECISION PIPELINE</text>
    <text x="16" y="32" font-size="11" fill="#64748b">End-to-end edge pipeline from structured employee intake to deterministic resolution or single-turn escalation</text>
  </g>

  <!-- PIPELINE STAGES -->

  <!-- STAGE 1: Intake Gateway -->
  <g transform="translate(32, 90)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="160" height="90" rx="8" fill="url(#inputGrad)" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="10" y="10" width="58" height="18" rx="4" fill="#e2e8f0"/>
    <text x="16" y="23" font-size="9" font-weight="700" fill="#475569">STAGE 1</text>
    <text x="10" y="44" font-size="12" font-weight="700" fill="#0f172a">Intake Gateway</text>
    <text x="10" y="60" font-size="10" fill="#475569">Form BM-HR-01 JSON</text>
    <text x="10" y="74" font-size="9.5" fill="#64748b">+ Medical/Leave Files</text>
  </g>

  <!-- Arrow: Stage 1 -> Stage 2 -->
  <path d="M 192 135 L 222 135" stroke="#2563eb" stroke-width="2" marker-end="url(#arrBlue)"/>

  <!-- STAGE 2: Local VLM Laser Scan -->
  <g transform="translate(230, 90)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="170" height="90" rx="8" fill="url(#vlmGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="10" y="10" width="80" height="18" rx="4" fill="#bfdbfe"/>
    <text x="16" y="23" font-size="9" font-weight="700" fill="#1d4ed8">LOCAL VLM 4B</text>
    <text x="10" y="44" font-size="12" font-weight="700" fill="#1e3a8a">Visual Validator</text>
    <text x="10" y="60" font-size="10" fill="#1e40af">• Red Clinic Stamp (Mộc)</text>
    <text x="10" y="74" font-size="9.5" fill="#2563eb">• Doctor Sign &amp; Date Clarity</text>
  </g>

  <!-- Arrow: Stage 2 -> Stage 3 -->
  <path d="M 400 135 L 430 135" stroke="#2563eb" stroke-width="2" marker-end="url(#arrBlue)"/>

  <!-- STAGE 3: Deterministic Rules Guardrails -->
  <g transform="translate(438, 90)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="180" height="90" rx="8" fill="url(#rulesGrad)" stroke="#eab308" stroke-width="1.5"/>
    <rect x="10" y="10" width="70" height="18" rx="4" fill="#fef08a"/>
    <text x="16" y="23" font-size="9" font-weight="700" fill="#854d0e">&lt; 5ms ENGINE</text>
    <text x="10" y="44" font-size="12" font-weight="700" fill="#713f12">Rules Engine</text>
    <text x="10" y="60" font-size="10" fill="#854d0e">• Leave Quotas &amp; Balances</text>
    <text x="10" y="74" font-size="9.5" fill="#a16207">• Probation &amp; Authority Tiers</text>
  </g>

  <!-- Arrow: Stage 3 -> Stage 4 Split -->
  <path d="M 618 135 L 658 135" stroke="#475569" stroke-width="2"/>
  <path d="M 658 135 L 658 200" stroke="#475569" stroke-width="2"/>

  <!-- BRANCH FORK CHANNELS -->
  <path d="M 658 200 L 220 200 L 220 230" stroke="#059669" stroke-width="2" marker-end="url(#arrGreen)"/>
  <path d="M 658 200 L 658 230" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrPurple)"/>

  <!-- Path Label: Routine Auto-Path -->
  <rect x="235" y="190" width="170" height="20" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="242" y="204" font-size="9.5" font-weight="700" fill="#065f46">ROUTINE: All Constraints Clear (92%)</text>

  <!-- Path Label: Escalation Path -->
  <rect x="535" y="190" width="175" height="20" rx="4" fill="#faf5ff" stroke="#a855f7" stroke-width="1"/>
  <text x="542" y="204" font-size="9.5" font-weight="700" fill="#6b21a8">UNCERTAINTY DETECTED: U_1, U_2, U_3 (8%)</text>

  <!-- LOWER LEFT: AUTO APPROVAL & AUDIT LEDGER -->
  <g transform="translate(110, 240)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="220" height="85" rx="8" fill="url(#autoGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="10" y="10" width="105" height="18" rx="4" fill="#a7f3d0"/>
    <text x="16" y="23" font-size="9" font-weight="700" fill="#065f46">INSTANT RESOLUTION</text>
    <text x="10" y="44" font-size="12" font-weight="700" fill="#064e3b">AUTO_APPROVE (&lt; 10ms)</text>
    <text x="10" y="60" font-size="10" fill="#047857">• Zero human intervention</text>
    <text x="10" y="74" font-size="9.5" fill="#059669">• Quota deducted deterministically</text>
  </g>

  <!-- Arrow: Auto Approve -> Audit Ledger -->
  <path d="M 220 325 L 220 365" stroke="#059669" stroke-width="2" marker-end="url(#arrGreen)"/>

  <!-- AUDIT LEDGER BOX -->
  <g transform="translate(110, 370)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="410" height="85" rx="8" fill="url(#ledgerGrad)" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="10" y="10" width="125" height="18" rx="4" fill="#bbf7d0"/>
    <text x="16" y="23" font-size="9" font-weight="700" fill="#14532d">IMMUTABLE AUDIT TRAIL</text>
    <text x="10" y="44" font-size="12" font-weight="700" fill="#14532d">Cryptographic SHA-256 Ledger &amp; Rollback Engine</text>
    <text x="10" y="60" font-size="10" fill="#15803d">• Hash Chaining: H_n = SHA-256(H_{n-1} || Action || Timestamp)</text>
    <text x="10" y="74" font-size="9.5" fill="#166534">• Sub-second Optimistic State Reversion via Snapshot Delta</text>
  </g>

  <!-- LOWER RIGHT: COGNITIVE LOCAL LLM & ESCALATION -->
  <g transform="translate(540, 240)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="235" height="85" rx="8" fill="url(#llmGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="10" y="10" width="115" height="18" rx="4" fill="#e9d5ff"/>
    <text x="16" y="23" font-size="9" font-weight="700" fill="#6b21a8">COGNITIVE REFEREE</text>
    <text x="10" y="44" font-size="12" font-weight="700" fill="#581c87">Single-Turn Closed Prompt</text>
    <text x="10" y="60" font-size="10" fill="#6b21a8">• Grounds specific regulation article</text>
    <text x="10" y="74" font-size="9.5" fill="#7e22ce">• 2 structured options: Reject vs. Exception</text>
  </g>

  <!-- Arrow: Cognitive LLM -> Manager Action -->
  <path d="M 658 325 L 658 365" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrPurple)"/>

  <!-- MANAGER REVIEW & OVERRIDE BOX -->
  <g transform="translate(540, 370)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="235" height="85" rx="8" fill="url(#mgrGrad)" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="10" y="10" width="130" height="18" rx="4" fill="#fecdd3"/>
    <text x="16" y="23" font-size="9" font-weight="700" fill="#9f1239">HUMAN-IN-THE-LOOP</text>
    <text x="10" y="44" font-size="12" font-weight="700" fill="#881337">Manager Decision / Undo</text>
    <text x="10" y="60" font-size="10" fill="#9f1239">• Action 0: Reject (Cites Policy)</text>
    <text x="10" y="74" font-size="9.5" fill="#be123c">• Action 1: Approve Exception / Revert</text>
  </g>

  <!-- Arrow: Manager -> Ledger Commit -->
  <path d="M 540 412 L 526 412" stroke="#475569" stroke-width="2" marker-end="url(#arrSlate)"/>

  <!-- Loopback Arrow: Manager Undo -> Reversion Rollback -->
  <path d="M 658 455 C 658 475 315 475 315 460" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrRose)"/>
  <rect x="420" y="462" width="140" height="16" rx="3" fill="#ffffff" stroke="#f43f5e" stroke-width="0.8"/>
  <text x="426" y="474" font-size="8.5" font-weight="700" fill="#be123c">Manager [Undo] Reversion</text>

</svg>
