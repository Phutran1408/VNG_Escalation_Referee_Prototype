<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="100%" height="100%" style="background: #ffffff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Style override to ensure NO unstyled paths get filled with black -->
    <style>
      path.connector { fill: none !important; }
      line { fill: none !important; }
    </style>

    <!-- Canvas Gradient -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- State Card Gradients -->
    <linearGradient id="stateSubmitted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="stateEvaluating" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>

    <linearGradient id="stateAutoApprove" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>

    <linearGradient id="stateEscalated" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>

    <linearGradient id="stateApproved" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>

    <linearGradient id="stateRejected" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>

    <linearGradient id="stateReverted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrB" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>

    <!-- Soft Card Shadow -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="12" y="12" width="876" height="506" rx="12" fill="url(#canvasGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Diagram Title / Header -->
  <g transform="translate(32, 38)">
    <rect x="0" y="0" width="8" height="20" rx="2" fill="#7c3aed"/>
    <text x="16" y="15" font-size="14" font-weight="700" fill="#0f172a" letter-spacing="0.02em">HÌNH 2: MÔ HÌNH MÁY TRẠNG THÁI HỮU HẠN &amp; VÒNG ĐỜI HỒ SƠ</text>
    <text x="16" y="32" font-size="11" fill="#64748b">Cơ chế chuyển dịch trạng thái tất định, điều kiện bảo vệ và ghi nhận sổ cái mật mã</text>
  </g>

  <!-- ==================== HÀNG 1 ==================== -->

  <!-- STATE 1: SUBMITTED -->
  <g transform="translate(36, 85)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="180" height="76" rx="8" fill="url(#stateSubmitted)" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="12" y="10" width="62" height="16" rx="3" fill="#e2e8f0"/>
    <text x="17" y="22" font-size="9" font-weight="700" fill="#475569">KHỞI TẠO</text>
    <text x="12" y="44" font-size="13" font-weight="700" fill="#0f172a">SUBMITTED</text>
    <text x="12" y="60" font-size="9.5" fill="#64748b">Tiếp nhận mẫu BM-HR-01</text>
  </g>

  <!-- Transition 1: SUBMITTED -> EVALUATING -->
  <path class="connector" d="M 216 123 L 314 123" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrB)"/>
  <rect x="226" y="102" width="78" height="18" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="231" y="115" font-size="8.5" font-weight="600" fill="#1e40af">Khởi chạy</text>

  <!-- STATE 2: EVALUATING -->
  <g transform="translate(320, 85)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="210" height="76" rx="8" fill="url(#stateEvaluating)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="12" y="10" width="75" height="16" rx="3" fill="#dbeafe"/>
    <text x="17" y="22" font-size="9" font-weight="700" fill="#1d4ed8">ĐANG XỬ LÝ</text>
    <text x="12" y="44" font-size="13" font-weight="700" fill="#1e3a8a">EVALUATING</text>
    <text x="12" y="60" font-size="9.5" fill="#2563eb">Soi VLM (V_doc) + Luật &lt; 5ms</text>
  </g>

  <!-- Transition 2: EVALUATING -> AUTO_APPROVED -->
  <path class="connector" d="M 530 123 L 644 123" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
  <rect x="540" y="98" width="95" height="22" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
  <text x="545" y="112" font-size="8.5" font-weight="700" fill="#065f46">V_doc=1 ∧ Đủ phép</text>

  <!-- STATE 3: AUTO_APPROVED -->
  <g transform="translate(650, 85)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="220" height="76" rx="8" fill="url(#stateAutoApprove)" stroke="#10b981" stroke-width="2"/>
    <rect x="12" y="10" width="105" height="16" rx="3" fill="#a7f3d0"/>
    <text x="17" y="22" font-size="9" font-weight="700" fill="#065f46">TỰ ĐỘNG DUYỆT</text>
    <text x="12" y="44" font-size="13" font-weight="700" fill="#064e3b">AUTO_APPROVED</text>
    <text x="12" y="60" font-size="9" fill="#059669">Duyệt &lt; 10ms · Ghi sổ cái SHA-256</text>
  </g>


  <!-- ==================== HÀNG 2 ==================== -->

  <!-- Transition 3: EVALUATING -> ESCALATED (Downward) -->
  <path class="connector" d="M 425 161 L 425 219" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrP)"/>
  <rect x="368" y="180" width="114" height="20" rx="4" fill="#faf5ff" stroke="#d8b4fe" stroke-width="0.8"/>
  <text x="375" y="194" font-size="9" font-weight="700" fill="#6b21a8">U_1 ∨ U_2 ∨ U_3 &gt; 0</text>

  <!-- STATE 4: ESCALATED -->
  <g transform="translate(320, 225)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="210" height="85" rx="8" fill="url(#stateEscalated)" stroke="#8b5cf6" stroke-width="1.8"/>
    <rect x="12" y="10" width="118" height="16" rx="3" fill="#ede9fe"/>
    <text x="17" y="22" font-size="9" font-weight="700" fill="#5b21b6">CHUYỂN TIẾP CẤP TRÊN</text>
    <text x="12" y="44" font-size="13" font-weight="700" fill="#4c1d95">ESCALATED</text>
    <text x="12" y="60" font-size="9.5" fill="#6b21a8">• Tổng hợp prompt 1 lượt</text>
    <text x="12" y="74" font-size="9.5" fill="#7c3aed">• Giao diện thẩm định Quản lý</text>
  </g>

  <!-- Transition 4: AUTO_APPROVED -> REVERTED (Undo Downward) -->
  <path class="connector" d="M 760 161 L 760 219" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4,4" fill="none" marker-end="url(#arrA)"/>
  <rect x="715" y="180" width="90" height="20" rx="3" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8"/>
  <text x="722" y="194" font-size="8.5" font-weight="700" fill="#92400e">Quản lý [Undo]</text>

  <!-- STATE 5: REVERTED -->
  <g transform="translate(650, 225)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="220" height="85" rx="8" fill="url(#stateReverted)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="12" y="10" width="85" height="16" rx="3" fill="#fef3c7"/>
    <text x="17" y="22" font-size="9" font-weight="700" fill="#92400e">HOÀN TÁC ĐƠN</text>
    <text x="12" y="44" font-size="13" font-weight="700" fill="#78350f">REVERTED</text>
    <text x="12" y="60" font-size="9.5" fill="#92400e">Khôi phục quỹ phép trong 0.1s</text>
    <text x="12" y="74" font-size="9" fill="#b45309">Delta Snapshot Rollback</text>
  </g>

  <!-- Transition 5: REVERTED -> ESCALATED (Leftward dashed) -->
  <path class="connector" d="M 650 267 L 536 267" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="3,3" fill="none" marker-end="url(#arrP)"/>
  <rect x="548" y="256" width="90" height="18" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="0.8"/>
  <text x="554" y="269" font-size="8" font-weight="600" fill="#6b21a8">Tái định tuyến</text>


  <!-- ==================== HÀNG 3: QUYẾT ĐỊNH CỦA QUẢN LÝ ==================== -->

  <!-- Transition 6: ESCALATED -> APPROVED (Action 1) -->
  <path class="connector" d="M 455 310 L 455 385 L 644 385" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
  <rect x="470" y="373" width="145" height="20" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
  <text x="477" y="387" font-size="8.5" font-weight="700" fill="#047857">Lựa chọn 1: Duyệt ngoại lệ</text>

  <!-- STATE 6: APPROVED (Exception) -->
  <g transform="translate(650, 355)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="220" height="60" rx="8" fill="url(#stateApproved)" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="12" y="25" font-size="12" font-weight="700" fill="#134e4a">APPROVED (Ngoại lệ)</text>
    <text x="12" y="44" font-size="9.5" fill="#0f766e">Ghi nhận lý do quản lý &amp; mã băm SHA-256</text>
  </g>

  <!-- Transition 7: ESCALATED -> REJECTED (Action 0) -->
  <path class="connector" d="M 395 310 L 395 465 L 644 465" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrR)"/>
  <rect x="440" y="453" width="175" height="20" rx="3" fill="#fef2f2" stroke="#fecaca" stroke-width="0.8"/>
  <text x="447" y="467" font-size="8.5" font-weight="700" fill="#b91c1c">Lựa chọn 0: Từ chối theo quy chế</text>

  <!-- STATE 7: REJECTED -->
  <g transform="translate(650, 435)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="220" height="60" rx="8" fill="url(#stateRejected)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="12" y="24" font-size="12" font-weight="700" fill="#7f1d1d">REJECTED (Không hợp lệ)</text>
    <text x="12" y="42" font-size="9.5" fill="#991b1b">Phát hành thông báo từ chối viện dẫn điều khoản</text>
  </g>

</svg>
