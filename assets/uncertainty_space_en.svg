<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background: #ffffff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    
    <linearGradient id="u1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    
    <linearGradient id="u2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    
    <linearGradient id="u3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    
    <linearGradient id="originGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowU3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrowU2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowU1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    
    <!-- Shadow filters -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="10" y="10" width="780" height="400" rx="10" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Diagram Title / Header -->
  <text x="30" y="36" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="0.02em">FIGURE 1: THREE-DIMENSIONAL ENTERPRISE UNCERTAINTY SPACE (U_Enterprise)</text>
  <text x="30" y="52" font-size="10.5" fill="#64748b">Orthogonal classification of corporate leave uncertainty determining deterministic escalation routing</text>

  <!-- Grid lines (subtle) -->
  <line x1="140" y1="230" x2="660" y2="230" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="400" y1="80" x2="400" y2="340" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- AXIS 3: U3 (Vertical Upward) -->
  <line x1="400" y1="230" x2="400" y2="70" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrowU3)"/>
  
  <!-- AXIS 2: U2 (Horizontal Right) -->
  <line x1="400" y1="230" x2="720" y2="230" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowU2)"/>
  
  <!-- AXIS 1: U1 (Horizontal Left / Isometric) -->
  <line x1="400" y1="230" x2="80" y2="230" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowU1)"/>

  <!-- ==================== U3 CARD (Top / Authority Breach) ==================== -->
  <g transform="translate(420, 68)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="280" height="88" rx="6" fill="url(#u3Grad)" stroke="#a5b4fc" stroke-width="1.2"/>
    <rect x="0" y="0" width="6" height="88" rx="3" fill="#4f46e5"/>
    <text x="14" y="20" font-size="11.5" font-weight="700" fill="#312e81">U₃: AUTHORITY BREACH</text>
    <rect x="185" y="8" width="85" height="16" rx="8" fill="#4f46e5"/>
    <text x="227.5" y="19.5" font-size="8.5" font-weight="600" fill="#ffffff" text-anchor="middle">HRD / CEO</text>
    
    <text x="14" y="40" font-size="10" font-weight="600" fill="#4338ca">• Unpaid Leave &gt; 5 days</text>
    <text x="155" y="40" font-size="9.5" fill="#64748b">(Article 18.1)</text>
    
    <text x="14" y="56" font-size="10" font-weight="600" fill="#4338ca">• Long-term Leave ≥ 20 days</text>
    <text x="175" y="56" font-size="9.5" fill="#64748b">(Article 18.3)</text>
    
    <text x="14" y="74" font-size="9" font-style="italic" fill="#475569">Action: Lock direct manager; route to HRD / Executive</text>
  </g>

  <!-- ==================== U2 CARD (Right / Policy Conflict) ==================== -->
  <g transform="translate(500, 245)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="270" height="96" rx="6" fill="url(#u2Grad)" stroke="#fca5a5" stroke-width="1.2"/>
    <rect x="0" y="0" width="6" height="96" rx="3" fill="#dc2626"/>
    <text x="14" y="20" font-size="11.5" font-weight="700" fill="#7f1d1d">U₂: POLICY CONFLICT</text>
    <rect x="165" y="8" width="95" height="16" rx="8" fill="#dc2626"/>
    <text x="212.5" y="19.5" font-size="8.5" font-weight="600" fill="#ffffff" text-anchor="middle">LINE MANAGER</text>
    
    <text x="14" y="40" font-size="10" font-weight="600" fill="#b91c1c">• Probation Employee Annual Leave</text>
    <text x="210" y="40" font-size="9.5" fill="#64748b">(Art. 8)</text>
    
    <text x="14" y="56" font-size="10" font-weight="600" fill="#b91c1c">• Personal Leave Missing Proof</text>
    <text x="195" y="56" font-size="9.5" fill="#64748b">(Art. 15)</text>
    
    <text x="14" y="74" font-size="9" font-style="italic" fill="#475569">Action: Single-turn prompt: Grant unpaid leave</text>
    <text x="14" y="86" font-size="9" font-style="italic" fill="#475569">or reject non-compliant request</text>
  </g>

  <!-- ==================== U1 CARD (Left / Data Ambiguity) ==================== -->
  <g transform="translate(30, 245)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="270" height="96" rx="6" fill="url(#u1Grad)" stroke="#fde68a" stroke-width="1.2"/>
    <rect x="0" y="0" width="6" height="96" rx="3" fill="#d97706"/>
    <text x="14" y="20" font-size="11.5" font-weight="700" fill="#78350f">U₁: DATA AMBIGUITY</text>
    <rect x="175" y="8" width="85" height="16" rx="8" fill="#d97706"/>
    <text x="217.5" y="19.5" font-size="8.5" font-weight="600" fill="#ffffff" text-anchor="middle">CLARIFICATION</text>
    
    <text x="14" y="40" font-size="10" font-weight="600" fill="#b45309">• Missing Social Insurance Form C65-HD</text>
    <text x="14" y="56" font-size="10" font-weight="600" fill="#b45309">• Blurred Clinic Stamp / Doctor Signature</text>
    
    <text x="14" y="74" font-size="9" font-style="italic" fill="#475569">Action: Auto-flag for physical C65-HD delivery</text>
    <text x="14" y="86" font-size="9" font-style="italic" fill="#475569">or clear medical certificate re-upload</text>
  </g>

  <!-- ==================== CENTER ORIGIN (Auto-Approval) ==================== -->
  <!-- Outer glowing pulse -->
  <circle cx="400" cy="230" r="22" fill="#10b981" fill-opacity="0.2"/>
  <circle cx="400" cy="230" r="14" fill="#10b981" stroke="#ffffff" stroke-width="2.5" filter="url(#cardShadow)"/>
  <text x="400" y="234" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">0</text>

  <!-- Origin Callout Box (Bottom Center) -->
  <g transform="translate(255, 275)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="290" height="92" rx="6" fill="url(#originGrad)" stroke="#6ee7b7" stroke-width="1.2"/>
    <rect x="0" y="0" width="6" height="92" rx="3" fill="#10b981"/>
    <text x="14" y="18" font-size="11" font-weight="800" fill="#065f46">ORIGIN (0, 0, 0): FAST-PATH AUTO-APPROVAL</text>
    
    <text x="14" y="36" font-size="9.5" font-weight="600" fill="#047857">✓ Sufficient annual leave balance (≤ 5 days)</text>
    <text x="14" y="50" font-size="9.5" font-weight="600" fill="#047857">✓ Verified hospital discharge / marriage proof</text>
    <text x="14" y="64" font-size="9.5" font-weight="600" fill="#047857">✓ Within Line Manager jurisdiction</text>
    
    <line x1="14" y1="72" x2="276" y2="72" stroke="#a7f3d0" stroke-width="1"/>
    <text x="14" y="84" font-size="9" font-weight="700" fill="#065f46">0 human touch · Deterministic execution &lt; 10ms</text>
  </g>

  <!-- Connector from Origin node to Origin card -->
  <path d="M 400 244 L 400 275" stroke="#10b981" stroke-width="1.8" stroke-dasharray="2,2"/>

</svg>
