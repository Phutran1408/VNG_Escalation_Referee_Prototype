  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>THE ESCALATION REFEREE \u2014 Product Showcase Film (Laptop Edition)</title>\n<style>\n:root{\n  --stage-base:#070A14;\n  --app-bg:#F8FAFC;\n  --blue:#2563EB;\n  --blue-deep:#1D4ED8;\n  --indigo:#4F46E5;\n  --indigo-dark:#312E81;\n  --amber:#F59E0B;\n  --amber-dark:#D97706;\n  --emerald:#10B981;\n  --rose:#EF4444;\n  --ink:#0F172A;\n  --ink-2:#334155;\n  --ink-3:#64748B;\n  --line:#E2E8F0;\n  --paper:#FFFFFF;\n  --glass:rgba(255,255,255,.07);\n  --glass-line:rgba(255,255,255,.14);\n}\n*{margin:0;padding:0;box-sizing:border-box}\nhtml,body{width:100%;height:100%;overflow:hidden;background:#03050B}\nbody{font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif}\na{color:var(--blue);text-decoration:none}\n#frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}\n#stage{position:relative;flex:none;width:1920px;height:1080px;overflow:hidden;transform-origin:center center;\n  background:radial-gradient(1400px 1000px at 60% 45%, #0F172A 0%, #090D1A 45%, var(--stage-base) 100%);}\n#vignette{position:absolute;inset:0;pointer-events:none;z-index:40;\n  background:radial-gradient(120% 100% at 50% 48%, rgba(0,0,0,0) 45%, rgba(2,4,9,.75) 100%);}\n#lift{position:absolute;inset:0;pointer-events:none;z-index:1;\n  background:radial-gradient(80% 70% at 10% 10%, rgba(37,99,235,.16), rgba(0,0,0,0) 70%),\n             radial-gradient(80% 70% at 90% 90%, rgba(79,70,229,.14), rgba(0,0,0,0) 70%);}\n.scene{position:absolute;inset:0;display:none;transition:opacity .4s ease}\n.scene.on{display:block}\n\n/* Ambient glow & particles */\n.amb{position:absolute;border-radius:50%;pointer-events:none;will-change:opacity,transform}\n.amb-blue{background:var(--blue);filter:blur(120px);opacity:.35}\n.amb-indigo{background:var(--indigo);filter:blur(130px);opacity:.30}\n.amb-amber{background:var(--amber);filter:blur(110px);opacity:.18}\n.pdot{position:absolute;border-radius:50%;background:#93C5FD;will-change:transform}\n\n/* Typography */\n.display{position:absolute;color:#F8FAFC;font-weight:900;letter-spacing:-.03em;line-height:1.06;z-index:5}\n.display .am{color:var(--amber)}\n.display .bl{color:#60A5FA}\n.display .em{color:#34D399}\n.word{display:inline-block;opacity:0;transform:translateY(24px)}\n.line{display:block;opacity:0;transform:translateY(32px)}\n\n/* LAPTOP 3D WORKSPACE CANVAS */\n.persp{position:absolute;perspective:1600px}\n.laptop{\n  position:relative;width:1040px;height:660px;background:#0F172A;border-radius:24px 24px 8px 8px;padding:12px 12px 16px;\n  transform-style:preserve-3d;\n  box-shadow:0 12px 30px rgba(0,0,0,.65), 0 80px 180px rgba(0,0,0,.75), 0 35px 100px rgba(37,99,235,.35), inset 0 0 0 2px #334155;\n}\n.laptop-base{\n  position:absolute;left:50%;bottom:-28px;transform:translateX(-50%);width:1160px;height:28px;\n  background:linear-gradient(180deg,#1E293B,#0F172A);border-radius:4px 4px 20px 20px;\n  box-shadow:0 30px 70px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.2);z-index:10;\n}\n.laptop-notch{\n  position:absolute;left:50%;top:0;transform:translateX(-50%);width:160px;height:8px;\n  background:#090D16;border-radius:0 0 8px 8px;\n}\n.trackpad{\n  position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:240px;height:12px;\n  border-radius:4px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);\n}\n\n/* Browser Window Shell */\n.browser{\n  width:1016px;height:632px;border-radius:16px;overflow:hidden;background:#F8FAFC;\n  display:flex;flex-direction:column;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.8);\n}\n.browser-bar{\n  height:44px;background:#0F172A;border-bottom:1px solid #1E293B;display:flex;align-items:center;padding:0 14px;gap:12px;flex:none;\n}\n.traffic-lights{display:flex;gap:7px}\n.traffic-lights i{width:11px;height:11px;border-radius:50%;display:inline-block}\n.tl-red{background:#EF4444}.tl-yellow{background:#F59E0B}.tl-green{background:#10B981}\n.url-pill{\n  flex:1;max-width:540px;height:28px;background:#1E293B;border-radius:8px;border:1px solid #334155;\n  display:flex;align-items:center;padding:0 12px;gap:8px;color:#94A3B8;font-size:11.5px;font-family:ui-monospace,Menlo,monospace;\n}\n.badge-engine{\n  background:rgba(16,185,129,.15);color:#34D399;border:1px solid rgba(16,185,129,.3);\n  font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;font-family:ui-monospace,Menlo,monospace;\n}\n\n/* System Header inside Browser */\n.sys-header{\n  height:48px;background:#1E293B;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff;\n}\n.brand-group{display:flex;align-items:center;gap:10px}\n.brand-icon{width:28px;height:28px;border-radius:8px;background:#4F46E5;display:flex;align-items:center;justify-content:center}\n.brand-name{font-weight:800;font-size:14px;letter-spacing:-.01em;color:#fff}\n.brand-tag{font-size:10px;font-weight:700;background:#0F172A;color:#93C5FD;border:1px solid #3B82F6;padding:2px 7px;border-radius:999px;text-transform:uppercase}\n.role-tabs{display:flex;gap:4px;background:#0F172A;padding:3px;border-radius:10px;border:1px solid #334155}\n.role-tab{padding:4px 12px;border-radius:7px;font-size:11.5px;font-weight:700;color:#94A3B8;cursor:pointer}\n.role-tab.active{background:#F59E0B;color:#0F172A}\n\n/* Browser Content Viewport */\n.browser-content{flex:1;overflow:hidden;padding:18px;display:flex;flex-direction:column;background:#F1F5F9}\n\n/* C\u1ed5ng N\u1ed9p \u0110\u01a1n (Applicant Viewport) */\n.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:100%}\n.drop-box{\n  border:2px dashed #CBD5E1;border-radius:16px;background:#FFFFFF;padding:22px 18px;\n  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;transition:all .3s ease;\n}\n.drop-box.highlight{border-color:#2563EB;background:#EFF6FF;box-shadow:0 10px 25px rgba(37,99,235,.15)}\n.drop-icon{width:56px;height:56px;border-radius:16px;background:#DBEAFE;color:#1D4ED8;display:flex;align-items:center;justify-content:center}\n.drop-title{font-size:16px;font-weight:800;color:#0F172A}\n.drop-sub{font-size:12px;color:#64748B;max-width:280px;line-height:1.4}\n.file-chip{\n  display:flex;align-items:center;gap:8px;background:#F8FAFC;border:1px solid #E2E8F0;padding:6px 12px;border-radius:8px;font-size:11px;font-weight:700;color:#1E293B;\n}\n\n/* C\u1ed5ng Th\u1ea9m \u0110\u1ecbnh (Reviewer Cockpit) */\n.reviewer-grid{display:grid;grid-template-columns:300px 1fr;gap:16px;height:100%}\n.queue-col{background:#FFFFFF;border-radius:14px;border:1px solid #E2E8F0;padding:12px;overflow:hidden;display:flex;flex-direction:column;gap:8px}\n.queue-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid #F1F5F9}\n.queue-item{padding:10px;border-radius:10px;border:1px solid #E2E8F0;background:#F8FAFC;transition:all .2s ease;cursor:pointer}\n.queue-item.active{background:#EFF6FF;border-color:#3B82F6;box-shadow:0 4px 12px rgba(37,99,235,.12)}\n\n/* 2 C\u1ed9t Song Song \u0110\u1ed1i So\u00e1t */\n.inspect-col{display:flex;flex-direction:column;gap:12px;overflow:hidden}\n.dual-pane{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1}\n.pane-card{background:#FFFFFF;border-radius:14px;border:1px solid #E2E8F0;padding:14px;display:flex;flex-direction:column;gap:8px}\n.pane-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:#1E293B}\n.vlm-preview{\n  height:140px;background:#F8FAFC;border-radius:10px;border:1px solid #E2E8F0;overflow:hidden;position:relative;\n  display:flex;align-items:center;justify-content:center;\n}\n.vlm-preview img{max-height:130px;object-fit:contain}\n.vlm-badge-row{display:flex;gap:6px;flex-wrap:wrap}\n.vlm-badge{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px;display:flex;align-items:center;gap:4px}\n.badge-green{background:#D1FAE5;color:#065F46;border:1px solid #A7F3D0}\n.badge-amber{background:#FEF3C7;color:#92400E;border:1px solid #FDE68A}\n.badge-red{background:#FEE2E2;color:#991B1B;border:1px solid #FECACA}\n\n/* AI Decision Banner */\n.verdict-banner{\n  background:#ECFDF5;border:1px solid #A7F3D0;border-radius:12px;padding:12px 16px;\n  display:flex;justify-content:space-between;align-items:center;\n}\n.verdict-banner.escalate{background:#FFFBEB;border-color:#FDE68A}\n.btn-action{\n  padding:8px 16px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;\n}\n.btn-approve{background:#059669;color:#fff}.btn-approve:hover{background:#047857}\n.btn-escalate{background:#D97706;color:#fff}.btn-escalate:hover{background:#B45309}\n.btn-check-all{background:#F59E0B;color:#0F172A;box-shadow:0 4px 14px rgba(245,158,11,.35)}\n\n/* Mouse Cursor Mockup */\n#laptopCursor{\n  position:absolute;z-index:90;pointer-events:none;filter:drop-shadow(0 6px 12px rgba(0,0,0,.6));\n  transition:transform .15s ease-out;\n}\n#cursorRipple{\n  position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(37,99,235,.45);\n  transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;z-index:89;\n}\n\n/* Big 3D stop cards (S7) */\n.stop-card{\n  position:absolute;width:440px;height:300px;border-radius:24px;background:rgba(15,23,42,.85);\n  border:1px solid var(--glass-line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);\n  box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.2);\n  padding:28px;display:flex;flex-direction:column;justify-content:space-between;opacity:0;\n}\n.stop-num{font-size:54px;font-weight:900;line-height:1}\n.stop-title{font-size:26px;font-weight:800;color:#F8FAFC;margin-top:6px}\n.stop-desc{font-size:15px;color:#94A3B8;line-height:1.5}\n.stop-q{background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.3);padding:10px 14px;border-radius:10px;color:#FDE68A;font-size:13px;font-weight:700}\n\n/* Logo Bars */\n.lbars{display:flex;align-items:flex-end;gap:18px;height:240px}\n.lbars i{width:42px;border-radius:14px;display:block;transform-origin:bottom;transform:scaleY(0)}\n\n/* Cover & Controls */\n#cover{\n  position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;\n  background:radial-gradient(1000px 700px at 50% 46%, #1E293B 0%, #03050B 75%);\n}\n.bigbtn{\n  display:flex;align-items:center;gap:16px;background:#F59E0B;color:#0F172A;border:none;font:inherit;\n  font-size:28px;font-weight:900;padding:22px 58px;border-radius:999px;cursor:pointer;\n  box-shadow:0 20px 50px rgba(245,158,11,.45), inset 0 1px 0 rgba(255,255,255,.4);transition:all .2s;\n}\n.bigbtn:hover{background:#FBBF24;transform:scale(1.03)}\n\n/* Ingestion Pipeline Steps */\n.pstp{\n  display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:10px;\n  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);\n  color:#94A3B8;font-size:14px;font-weight:600;transition:all .3s ease;\n}\n.pstp .pb{\n  width:24px;height:24px;border-radius:50%;border:2px solid #64748B;\n  display:flex;align-items:center;justify-content:center;flex:none;transition:all .3s ease;\n}\n.pstp .pb i{width:6px;height:6px;border-radius:50%;background:#64748B;display:block}\n.pstp.on{\n  background:rgba(37,99,235,.20);border-color:#3B82F6;color:#F8FAFC;box-shadow:0 0 20px rgba(59,130,246,.25);\n}\n.pstp.on .pb{border-color:#60A5FA;box-shadow:0 0 10px rgba(96,165,250,.6)}\n.pstp.on .pb i{background:#60A5FA}\n.pstp.done{\n  background:rgba(16,185,129,.12);border-color:#10B981;color:#A7F3D0;\n}\n.pstp.done .pb{border-color:#34D399;background:#10B981}\n.pstp.done .pb i{background:#042F2E}\n</style>\n</head>\n<body>\n<div id=\"frame\"><div id=\"stage\">\n\n  <!-- Persistent Atmosphere -->\n  <div class=\"amb amb-blue\" id=\"az1\" style=\"left:180px;top:120px;width:1100px;height:840px;opacity:.08;z-index:1\"></div>\n  <div class=\"amb amb-amber\" id=\"az2\" style=\"left:1140px;top:440px;width:800px;height:700px;opacity:.05;z-index:1\"></div>\n  <div id=\"pback\" style=\"position:absolute;inset:0;z-index:2;pointer-events:none\"></div>\n  <div id=\"pfront\" style=\"position:absolute;inset:0;z-index:34;pointer-events:none\"></div>\n\n  <!-- S0A: THE HOOK (3,200ms) -->\n  <div class=\"scene\" id=\"s0a\">\n    <div style=\"position:absolute;inset:0;background:#03050B\"></div>\n    <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5\">\n      <div id=\"h0\" style=\"position:absolute;color:#F8FAFC;font-size:180px;font-weight:900;letter-spacing:-.045em;line-height:1\">Absences.</div>\n      <div id=\"h1\" style=\"position:absolute;color:#F8FAFC;font-size:180px;font-weight:900;letter-spacing:-.045em;line-height:1;opacity:0\">Leaves.</div>\n      <div id=\"h2\" style=\"position:absolute;color:#F8FAFC;font-size:180px;font-weight:900;letter-spacing:-.045em;line-height:1;opacity:0\">Approvals.</div>\n    </div>\n  </div>\n\n  <!-- S0B: THE PAIN (3,200ms) -->\n  <div class=\"scene\" id=\"s0b\">\n    <div style=\"position:absolute;inset:0;background:#03050B\"></div>\n    <div id=\"s0bflash\" style=\"position:absolute;inset:0;opacity:0;z-index:4;mix-blend-mode:screen;background:radial-gradient(80% 70% at 50% 50%,rgba(239,68,68,.6),rgba(153,27,27,.2) 60%,transparent)\"></div>\n    <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5\">\n      <div id=\"k0\" style=\"position:absolute;color:#F8FAFC;font-size:170px;font-weight:900;letter-spacing:-.04em\">High volume.</div>\n      <div id=\"kBlind\" style=\"position:absolute;color:#FFF;font-size:220px;font-weight:900;letter-spacing:-.045em;opacity:0\">Manual triage.</div>\n      <div id=\"kCoach\" style=\"position:absolute;color:#EF4444;font-size:230px;font-weight:900;letter-spacing:-.045em;opacity:0\">Blind risks.</div>\n    </div>\n  </div>\n\n  <!-- S1: THE REVEAL (4,500ms) -->\n  <div class=\"scene\" id=\"s1\">\n    <div class=\"amb amb-blue\" id=\"s1glow\" style=\"left:600px;top:280px;width:720px;height:560px;opacity:.25\"></div>\n    <div class=\"amb amb-amber\" id=\"s1amber\" style=\"left:1020px;top:480px;width:500px;height:420px;opacity:.12\"></div>\n    <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;z-index:5\">\n      <div style=\"display:flex;align-items:center;gap:36px\">\n        <div class=\"lbars\" id=\"s1bars\">\n          <i style=\"height:76px;background:#60A5FA;width:32px\"></i>\n          <i style=\"height:124px;background:#60A5FA;width:32px\"></i>\n          <i style=\"height:172px;background:#F8FAFC;width:32px\"></i>\n          <i style=\"height:210px;background:#F59E0B;width:32px\"></i>\n        </div>\n        <div style=\"font-size:132px;font-weight:900;letter-spacing:-.02em;color:#F8FAFC;line-height:1\" id=\"s1word\">\n          ESCALATION REFEREE\n        </div>\n      </div>\n      <div id=\"s1tag\" style=\"color:#94A3B8;font-size:40px;font-weight:600;letter-spacing:.06em;opacity:0\">\n        Smart stops. Zero over-escalation<span class=\"am\">.</span>\n      </div>\n    </div>\n  </div>\n\n  <!-- S2: THE PROBLEM (4,200ms) -->\n  <div class=\"scene\" id=\"s2\">\n    <div class=\"amb amb-blue\" style=\"left:380px;top:200px;width:1000px;height:650px;opacity:.28\"></div>\n    <div class=\"display\" id=\"s2line\" style=\"left:180px;top:380px;width:1560px;font-size:114px\">\n      <span class=\"word\">Every leave request</span> <span class=\"word\">carries uncertainty.</span><br>\n      <span id=\"s2type\" style=\"color:#F59E0B\"></span><span id=\"s2caret\" style=\"display:inline-block;width:8px;height:.85em;background:#F8FAFC;vertical-align:-.06em;margin-left:10px\"></span>\n    </div>\n  </di index:8\">\n      <div style=\"display:flex;align-items:center;gap:36px\">\n        <div class=\"lbars\" id=\"s10bars\" style=\"height:180px;gap:14px\">\n          <i style=\"height:66px;background:#60A5FA;width:28px\"></i>\n          <i style=\"height:108px;background:#60A5FA;width:28px\"></i>\n          <i style=\"height:150px;background:#F8FAFC;width:28px\"></i>\n          <i style=\"height:180px;background:#F59E0B;width:28px\"></i>\n        </div>\n        <div style=\"font-size:116px;font-weight:900;letter-spacing:-.02em;color:#F8FAFC;line-height:1\" id=\"s10word\">\n          ESCALATION REFEREE\n        </div>\n      </div>\n      <div id=\"s10tag\" style=\"color:#94A3B8;font-size:42px;font-weight:600;letter-spacing:.08em;opacity:0\">\n        OrganizationAI Live \u00b7 16/16 Pass \u00b7 0% Over-escalation<span class=\"am\">.</span>\n      </div>\n      <button class=\"bigbtn\" id=\"replayBtn\" style=\"opacity:0;pointer-events:none\">\u21bb&nbsp; Replay</button>\n    </div>\n  </div>\n\n  <div id=\"lift\"></div>\n  <div id=\"vignette\"></div>\n\n  <!-- Initial Cover Screen -->\n  <div id=\"cover\">\n    <div style=\"display:flex;align-items:center;gap:24px\">\n      <div class=\"lbars\" style=\"height:140px;gap:10px\">\n        <i style=\"height:50px;background:#60A5FA;width:20px;transform:scaleY(1)\"></i>\n        <i style=\"height:80px;background:#60A5FA;width:20px;transform:scaleY(1)\"></i>\n        <i style=\"height:115px;background:#F8FAFC;width:20px;transform:scaleY(1)\"></i>\n        <i style=\"height:140px;background:#F59E0B;width:20px;transform:scaleY(1)\"></i>\n      </div>\n      <div style=\"font-size:74px;font-weight:900;color:#F8FAFC;letter-spacing:-.02em\">ESCALATION REFEREE</div>\n    </div>\n    <div style=\"color:#94A3B8;font-size:24px;font-weight:600;letter-spacing:.06em\">\n      Spec A \u00b7 OrganizationAI \u00b7 Laptop Workspace Showcase Film\n    </div>\n    <button class=\"bigbtn\" id=\"playBtn\">\u25b6&nbsp; Watch Film (71s Relaxed)</button>\n  </div>\n\n</div></div>\n\n<script>\n(function(){\n\"use strict\";\nvar $=function(i){return document.getElementById(i)};\nvar stage=$('stage'), cur=-1, t0=0, raf=null, fadingId=null;\n\n/* Relaxed Pacing Timeline (Total ~71.1s = 71,100ms) */\nvar SCENES=[\n  {id:'s0a', dur:3200},\n  {id:'s0b', dur:3200},\n  {id:'s1',  dur:4500},\n  {id:'s2',  dur:4200},\n  {id:'s3',  dur:5500},\n  {id:'s3b', dur:5000},\n  {id:'s4',  dur:5500},\n  {id:'s5',  dur:5500},\n  {id:'s6',  dur:6000},\n  {id:'s7',  dur:6500},\n  {id:'s8',  dur:5500},\n  {id:'s9b', dur:4500},\n  {id:'s9c', dur:5000},\n  {id:'s10', dur:5000}\n];\n\nvar BOUNDS=[], TOTAL=0;\nSCENES.forEach(function(s){ BOUNDS.push(TOTAL); s.start=TOTAL; TOTAL+=s.dur; });\n\n/* Helper math / easings */\nfunction cl(v){return Math.max(0,Math.min(1,v))}\nfunction seg(t,a,b){return cl((t-a)/(b-a))}\nfunction eIn(x){return x*x*x}\nfunction eOut(x){return 1-Math.pow(1-x,3)}\nfunction eIO(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}\n\nfunction resize(){\n  var w=window.innerWidth, h=window.innerHeight;\n  var s=Math.min(w/1920, h/1080);\n  stage.style.transform='scale('+s+')';\n}\nwindow.addEventListener('resize', resize);\nresize();\n\n/* Scene Render Handlers */\nvar R={};\n\n/* S0A: The Hook */\nR.s0a=function(t){\n  var i=t<1000?0:(t<2000?1:2);\n  for(var j=0;j<3;j++) $('h'+j).style.opacity=(j===i)?1:0;\n};\n\n/* S0B: The Pain */\nR.s0b=function(t){\n  var stage=t<1100?0:(t<2100?1:2);\n  $('k0').style.opacity=stage===0?1:0;\n  $('kBlind').style.opacity=stage>=1?1:0;\n  $('kCoach').style.opacity=stage===2?1:0;\n  if(stage===1){\n    var u=t-1100;\n    $('s0bflash').style.opacity=(Math.sin(u*0.02)*0.4+0.4).toFixed(3);\n  } else {\n    $('s0bflash').style.opacity=0;\n  }\n};\n\n/* S1: Logo Reveal */\nR.s1=function(t){\n  var a=eOut(seg(t,200,1600));\n  var bars=$('s1bars').children;\n  for(var i=0;i<4;i++){\n    var p=eOut(seg(t,200+i*180,1100+i*180));\n    bars[i].style.transform='scaleY('+p+')';\n  }\n  $('s1word').style.opacity=a.toFixed(3);\n  $('s1word').style.transform='translateY('+((1-a)*30)+'px)';\n  $('s1tag').style.opacity=eOut(seg(t,1400,2400)).toFixed(3);\n};\n\n/* S2: Problem Statement */\nR.s2=function(t){\n  var words=$('s2line').querySelectorAll('.word');\n  words.forEach(function(w,idx){\n    var p=eOut(seg(t,200+idx*400,900+idx*400));\n    w.style.opacity=p.toFixed(3);\n    w.style.transform='translateY('+((1-p)*20)+'px)';\n  });\n  var txt=\"Policy ambiguity, missing medical seals, authority threshold.\";\n  var charCount=Math.floor(seg(t,1400,3400)*txt.length);\n  $('s2type').textContent=txt.slice(0,charCount);\n};\n\n/* S3: Applicant Portal Laptop Drag & Drop */\nR.s3=function(t){\n  var a=eOut(seg(t,0,900));\n  $('s3copy').style.opacity=a.toFixed(3);\n  $('s3l1').style.opacity=eOut(seg(t,100,800)).toFixed(3);\n  $('s3l2').style.opacity=eOut(seg(t,400,1100)).toFixed(3);\n\n  /* Mouse move & drop animation */\n  var m=$('s3mouse');\n  if(t<600){ m.style.opacity=0; }\n  else if(t<2200){\n    m.style.opacity=1;\n    var mp=eIO(seg(t,600,2000));\n    m.style.left=(1200 - mp*160)+'px';\n    m.style.top=(700 - mp*220)+'px';\n  } else if(t<3800){\n    m.style.opacity=1;\n    var mp2=eIO(seg(t,2200,3600));\n    m.style.left=(1040 + mp2*220)+'px';\n    m.style.top=(480 + mp2*20)+'px';\n  } else {\n    m.style.opacity=1;\n  }\n\n  /* File drop visual */\n  if(t>=1800){\n    $('s3dropPdf').classList.add('highlight');\n    $('s3pdfChip').style.opacity=eOut(seg(t,1800,2300)).toFixed(3);\n  } else {\n    $('s3dropPdf').classList.remove('highlight');\n    $('s3pdfChip').style.opacity=0;\n  }\n\n  if(t>=3400){\n    $('s3dropImg').classList.add('highlight');\n    $('s3imgChip').style.opacity=eOut(seg(t,3400,3900)).toFixed(3);\n  } else {\n    $('s3dropImg').classList.remove('highlight');\n    $('s3imgChip').style.opacity=0;\n  }\n};\n\n/* S3B: Ingestion Pipeline */\nR.s3b=function(t){\n  var a=eOut(seg(t,0,700));\n  $('s3bpanel').style.opacity=a.toFixed(3);\n  $('s3bpanel').style.transform='translateX('+((1-a)*-40)+'px)';\n  $('s3bcopy').style.opacity=a.toFixed(3);\n  $('s3bl1').style.opacity=eOut(seg(t,200,800)).toFixed(3);\n  $('s3bl2').style.opacity=eOut(seg(t,500,1100)).toFixed(3);\n\n  $('s3bspin').style.transform='rotate('+(t*0.2)+'deg)';\n\n  for(var i=0;i<5;i++){\n    var on=t>=500+i*800, done=t>=500+(i+1)*800;\n    var el=$('p'+i);\n    if(el){\n      el.classList.toggle('on', on && !done);\n      el.classList.toggle('done', done);\n    }\n  }\n};\n\n/* S4: VLM Inspection */\nR.s4=function(t){\n  var a=eOut(seg(t,0,800));\n  $('s4copy').style.opacity=a.toFixed(3);\n  $('s4copy').style.transform='translateY('+((1-a)*20)+'px)';\n};\n\n/* S5: Reviewer Cockpit */\nR.s5=function(t){\n  var a=eOut(seg(t,0,800));\n  $('s5copy').style.opacity=a.toFixed(3);\n  $('s5l1').style.opacity=eOut(seg(t,100,700)).toFixed(3);\n  $('s5l2').style.opacity=eOut(seg(t,400,1000)).toFixed(3);\n};\n\n/* S6: 1-Click Agent Check */\nR.s6=function(t){\n  var a=eOut(seg(t,0,700));\n  $('s6copy').style.opacity=a.toFixed(3);\n  $('s6l1').style.opacity=eOut(seg(t,100,700)).toFixed(3);\n  $('s6l2').style.opacity=eOut(seg(t,400,1000)).toFixed(3);\n\n  var lat=(Math.min(5.8, 48 - eOut(seg(t,400,2000))*42.2)).toFixed(1);\n  $('s6latNum').textContent=lat+' ms';\n};\n\n/* S7: 3 Smart Stops */\nR.s7=function(t){\n  $('s7copy').style.opacity=eOut(seg(t,0,700)).toFixed(3);\n  $('s7l1').style.opacity=eOut(seg(t,100,700)).toFixed(3);\n  $('s7l2').style.opacity=eOut(seg(t,300,900)).toFixed(3);\n\n  var cards=[$('cardStop1'), $('cardStop2'), $('cardStop3')];\n  cards.forEach(function(c,i){\n    var cp=eOut(seg(t,600+i*800, 1600+i*800));\n    c.style.opacity=cp.toFixed(3);\n    c.style.transform='translateY('+((1-cp)*40)+'px)';\n  });\n};\n\n/* S8: Single Turn Action */\nR.s8=function(t){\n  var a=eOut(seg(t,0,700));\n  $('s8copy').style.opacity=a.toFixed(3);\n  $('s8l1').style.opacity=eOut(seg(t,100,700)).toFixed(3);\n  $('s8l2').style.opacity=eOut(seg(t,400,1000)).toFixed(3);\n};\n\n/* S9B: Multi-domain */\nR.s9b=function(t){\n  var ti=eOut(seg(t,0,500));\n  $('s9btitle').style.opacity=ti.toFixed(3);\n  var kicks=[400,1400,2400];\n  for(var i=0;i<3;i++){\n    var p=eOut(seg(t,kicks[i],kicks[i]+800));\n    var el=$('s9r'+i);\n    el.style.opacity=p.toFixed(3);\n    el.style.transform='translateY('+((1-p)*30)+'px)';\n  }\n};\n\n/* S9C: Climax & CTA */\nR.s9c=function(t){\n  $('c1').style.opacity=eOut(seg(t,200,1000)).toFixed(3);\n  $('c2').style.opacity=eOut(seg(t,800,1600)).toFixed(3);\n  var out=eOut(seg(t,2400,3000));\n  $('c1').style.opacity=(eOut(seg(t,200,1000))*(1-out)).toFixed(3);\n  $('c2').style.opacity=(eOut(seg(t,800,1600))*(1-out)).toFixed(3);\n\n  $('c3').style.opacity=(eOut(seg(t,2600,3400))).toFixed(3);\n  $('ctaBtn').style.opacity=(eOut(seg(t,3000,3800))).toFixed(3);\n};\n\n/* S10: End Card */\nR.s10=function(t){\n  var a=eOut(seg(t,200,1200));\n  var bars=$('s10bars').children;\n  for(var i=0;i<4;i++){\n    bars[i].style.transform='scaleY('+(eOut(seg(t,200+i*150,900+i*150)))+')';\n  }\n  $('s10word').style.opacity=a.toFixed(3);\n  $('s10tag').style.opacity=eOut(seg(t,1000,2000)).toFixed(3);\n\n  if(t>2200){\n    $('replayBtn').style.opacity=eOut(seg(t,2200,3000)).toFixed(3);\n    $('replayBtn').style.pointerEvents='auto';\n  }\n};\n\nfunction show(i){\n  if(i===cur) return;\n  if(fadingId!==null){ var f=$(fadingId); f.classList.remove('on'); f.style.opacity=''; fadingId=null; }\n  var ne=$(SCENES[i].id); ne.classList.add('on'); ne.style.opacity='1';\n  if(cur>=0){\n    var pe=$(SCENES[cur].id);\n    pe.style.opacity='0'; fadingId=SCENES[cur].id;\n  }\n  cur=i;\n}\n\nfunction tick(now){\n  var t=now-t0;\n  if(t>=TOTAL){\n    var L=SCENES.length-1; show(L); R[SCENES[L].id](SCENES[L].dur); raf=null; return;\n  }\n  var i=SCENES.length-1; while(i>0&&t<SCENES[i].start) i--;\n  show(i);\n  var lt=t-SCENES[i].start;\n  R[SCENES[i].id](lt);\n  raf=requestAnimationFrame(tick);\n}\n\n$('playBtn').addEventListener('click',play);\n$('replayBtn').addEventListener('click',play);\n\nfunction play(){\n  if(raf) cancelAnimationFrame(raf);\n  cur=-1;\n  $('replayBtn').style.opacity=0; $('replayBtn').style.pointerEvents='none';\n  SCENES.forEach(function(s){ var el=$(s.id); el.classList.remove('on'); el.style.opacity=''; });\n  fadingId=null;\n  $('cover').style.display='none';\n  raf=requestAnimationFrame(function(n){ t0=n; tick(n); });\n}\n})();\n<\/script>\n</body>\n</html>"
  </script>\n\n\n\n</body></html>"
